name: Monthly Free MCQs - MANUAL ONLY (replaced by the weekly job)

# GK / Science / GS sets are now built WEEKLY by fetch-free-weekly.yml (and English by fetch-free-english-weekly.yml).
# The monthly schedule was removed so the two do not both create sets. Use "Run workflow" only if you ever need a monthly set.
on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to build, yyyy-MM (blank = previous month)'
        required: false
        default: ''
      force:
        description: 'Rebuild sets that already exist (true/false)'
        required: false
        default: 'false'

concurrency:
  group: fetch-free-mcqs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install
        working-directory: production-app-guide/free-scripts
      - run: node fetch-free-mcqs.js
        working-directory: production-app-guide/free-scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONTH: ${{ github.event.inputs.month }}
          FORCE: ${{ github.event.inputs.force }}
