name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'flutter-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}   # also lets you press "Run workflow" by hand

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: flutter-app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      # The ZIP contains lib/, pubspec.yaml, assets/ and a ready manifest.
      # The android/ platform folder is generated fresh here on every run.
      # `flutter create` only fills in what is missing - it never touches
      # lib/, pubspec.yaml or assets/.
      - name: Generate the Android platform folder
        run: flutter create --platforms=android --org com.yashstudyhub --project-name yash_study_hub .

      # STABLE APP SIGNING (one-time setup): once you add the two secrets
      # ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD (Settings >
      # Secrets and variables > Actions), every build from here on is signed
      # with the SAME key, so a new APK installs as an UPDATE over the old
      # one - no more uninstalling first. Skipped cleanly if the secret isn't
      # set yet: the APK still builds, just signed with the usual debug key.
      - name: Set up stable app signing (only if the secret is set)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=upload
          storeFile=upload-keystore.jks
          PROPS

      # Sets the app id (com.yashstudyhub.app), minSdk 23 and puts the correct
      # AndroidManifest.xml in place. See flutter-app/tools/patch_android.py
      - name: Apply Yash Study Hub Android settings
        run: python3 tools/patch_android.py .

      - name: DEBUG - show what compileSdk actually ended up as
        run: |
          echo "--- android/app/build.gradle.kts (or .gradle) compileSdk line(s) ---"
          grep -n -i "compileSdk" android/app/build.gradle.kts 2>/dev/null || grep -n -i "compileSdk" android/app/build.gradle 2>/dev/null || echo "no app/build.gradle(.kts) found"
          echo "--- android/local.properties compileSdk line(s) ---"
          grep -n -i "compileSdk" android/local.properties 2>/dev/null || echo "no local.properties found"

      - name: Install dependencies
        run: flutter pub get

      # Some older plugins (downloaded fresh into the pub-cache on every run,
      # not part of our own code) still ship their own android/build.gradle
      # pointing at the old proguard-android.txt, which newer R8 now refuses
      # outright. This finds every such file across ALL downloaded plugins
      # and switches it to the optimizing file Google recommends - the exact
      # fix the build error itself suggests.
      - name: Work around old plugins still referencing proguard-android.txt
        run: |
          found=$(find "$HOME/.pub-cache" \( -name "build.gradle" -o -name "build.gradle.kts" \) -print 2>/dev/null | xargs -r grep -l "proguard-android\.txt" || true)
          if [ -n "$found" ]; then
            echo "$found" | xargs sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g"
            echo "Patched:"
            echo "$found"
          else
            echo "No plugin build.gradle files referenced the old proguard-android.txt"
          fi

      # Some plugins (file_picker among them) ship their OWN android/build.gradle
      # with compileSdk hardcoded too low - this is a SEPARATE Gradle subproject
      # from our own android/app, so patch_android.py raising our app's compileSdk
      # has no effect on it. Bump any plugin's own compileSdk that is below 36.
      - name: Bump compileSdk in downloaded plugins that need it
        run: |
          python3 - <<'PYEOF'
          import glob, os, re

          MIN_SDK = 36
          pub_cache = os.path.expanduser("~/.pub-cache")
          changed = []
          for pattern in ("**/android/build.gradle", "**/android/build.gradle.kts"):
              for path in glob.glob(os.path.join(pub_cache, pattern), recursive=True):
                  with open(path, encoding="utf-8", errors="ignore") as f:
                      text = f.read()

                  def repl(m):
                      prefix, num = m.group(1), int(m.group(2))
                      return prefix + str(MIN_SDK) if num < MIN_SDK else m.group(0)

                  new_text, n = re.subn(r"(compileSdk(?:Version)?\s*=?\s*)(\d+)", repl, text)
                  if new_text != text:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(new_text)
                      changed.append(path)
          if changed:
              print("Bumped compileSdk (>= %d) in:" % MIN_SDK)
              for p in changed:
                  print(" ", p)
          else:
              print("No plugin build.gradle files needed a compileSdk bump")
          PYEOF

      # BLACKISH + YELLOW THEME, applied automatically at build time.
      # The dark-blue colours in lib/*.dart are swapped for black/dark-grey
      # shades right here, so no source file has to be edited by hand. The
      # starry-sky stars/asteroids/shooting-star code is NOT touched (only the
      # background behind them). To go back to dark blue, delete this step.
      - name: Apply Blackish + Yellow theme
        run: |
          python3 - <<'PYEOF'
          import os, re

          COLORS = {
              "050B24": "0A0A0A", "081136": "141414", "0A1440": "0F0F0F",
              "101D57": "1E1E1E", "16276A": "2A2A2A", "192B72": "262626",
              "1D3184": "333333", "0B1233": "0D0D0D", "04050D": "000000",
              "9AA3C7": "A0A0A0", "D7DCF2": "DDDDDD", "DDE3FF": "E8E8E8",
              "0x336440D2": "0x14FFFF29", "0x006440D2": "0x00FFFF29",
              "0x241E82D2": "0x10FFFFFF", "0x001E82D2": "0x00FFFFFF",
              "0x73829FFF": "0x59FFFF29",
          }
          changed = 0
          for folder, _, names in os.walk("lib"):
              for name in names:
                  if not name.endswith(".dart"):
                      continue
                  path = os.path.join(folder, name)
                  with open(path, encoding="utf-8") as f:
                      text = f.read()
                  new = text
                  for old, repl in COLORS.items():
                      new = re.sub(re.escape(old), repl, new, flags=re.I)
                  if new != text:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(new)
                      changed += 1
          print("Blackish theme applied to %d dart file(s)" % changed)
          PYEOF

      - name: Build release APK
        # IMAGE_UPLOAD_TOKEN comes from a repository secret (Settings >
        # Secrets and variables > Actions > New repository secret) - never
        # from the source code. If the secret is not created, the APK still
        # builds; only image uploads (logo/banners/icons) will not work.
        #
        # continue-on-error: if this FULL build fails, the next step rebuilds
        # in SAFE MODE so you still get a working APK (see tools/safe_mode.py).
        id: full_build
        continue-on-error: true
        env:
          IMAGE_UPLOAD_TOKEN: ${{ secrets.IMAGE_UPLOAD_TOKEN }}
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols --dart-define=IMAGE_UPLOAD_TOKEN="$IMAGE_UPLOAD_TOKEN"

      # Safety net. Runs ONLY when the full build above failed. Switches off
      # the two newest add-ons (in-app PDF viewer + Firebase google-services)
      # and builds again. If this also fails, the real error is in the step
      # "Build release APK" above - open that step and look for the first
      # line that starts with "error:" / "Error:".
      - name: Rebuild in SAFE MODE (only if the full build failed)
        if: steps.full_build.outcome == 'failure'
        env:
          IMAGE_UPLOAD_TOKEN: ${{ secrets.IMAGE_UPLOAD_TOKEN }}
        run: |
          echo "::warning title=Full build failed::Rebuilding in SAFE MODE (no in-app PDF viewer, no google-services). Open the step 'Build release APK' to see the real error."
          echo "### Built in SAFE MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "The full build failed, so the in-app PDF viewer and google-services were switched off. Send the first error line from the step 'Build release APK' to get them back." >> "$GITHUB_STEP_SUMMARY"
          python3 tools/safe_mode.py .
          flutter pub get
          found=$(find "$HOME/.pub-cache" \( -name "build.gradle" -o -name "build.gradle.kts" \) -print 2>/dev/null | xargs -r grep -l "proguard-android\.txt" || true)
          if [ -n "$found" ]; then
            echo "$found" | xargs sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g"
          fi
          python3 - <<'PYEOF'
          import glob, os, re

          MIN_SDK = 36
          pub_cache = os.path.expanduser("~/.pub-cache")
          changed = []
          for pattern in ("**/android/build.gradle", "**/android/build.gradle.kts"):
              for path in glob.glob(os.path.join(pub_cache, pattern), recursive=True):
                  with open(path, encoding="utf-8", errors="ignore") as f:
                      text = f.read()

                  def repl(m):
                      prefix, num = m.group(1), int(m.group(2))
                      return prefix + str(MIN_SDK) if num < MIN_SDK else m.group(0)

                  new_text, n = re.subn(r"(compileSdk(?:Version)?\s*=?\s*)(\d+)", repl, text)
                  if new_text != text:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(new_text)
                      changed.append(path)
          if changed:
              print("Bumped compileSdk (>= %d) in:" % MIN_SDK)
              for p in changed:
                  print(" ", p)
          PYEOF
          flutter build apk --release --obfuscate --split-debug-info=build/symbols --dart-define=IMAGE_UPLOAD_TOKEN="$IMAGE_UPLOAD_TOKEN"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: yash-study-hub-apk
          path: flutter-app/build/app/outputs/flutter-apk/app-release.apk
