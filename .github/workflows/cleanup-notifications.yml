name: Cleanup Old Notifications (free, no Blaze needed)

on:
  schedule:
    - cron: '0 3 * * *'   # once a day (GitHub may run it a few minutes late)
  workflow_dispatch: {}

# Never let two runs overlap.
concurrency:
  group: cleanup-notifications
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: production-app-guide/free-scripts
      - run: node cleanup-notifications.js
        working-directory: production-app-guide/free-scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
