name: Fetch Daily Current Affairs (free, PIB + Gemini)

on:
  schedule:
    - cron: '17 * * * *'   # every hour (PIB feed only keeps the latest ~20 releases, so 4-hour gaps lost most of them)
  workflow_dispatch: {}

concurrency:
  group: fetch-daily-ca
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install
        working-directory: production-app-guide/free-scripts
      - run: node fetch-daily-ca.js
        working-directory: production-app-guide/free-scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
