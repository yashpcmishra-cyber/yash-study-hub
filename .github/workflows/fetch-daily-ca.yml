name: Fetch Daily Current Affairs (free, PIB + Gemini)

on:
  schedule:
    - cron: '30 0,4,8,12,16 * * *'   # every 4 hours: 6 AM, 10 AM, 2 PM, 6 PM, 10 PM IST
  workflow_dispatch: {}

concurrency:
  group: fetch-daily-ca
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install
        working-directory: production-app-guide/free-scripts
      - run: node fetch-daily-ca.js
        working-directory: production-app-guide/free-scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
