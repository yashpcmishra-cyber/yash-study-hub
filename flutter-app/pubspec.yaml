name: yash_study_hub
description: Yash Study Hub - Competitive Exam Prep App
publish_to: 'none'
version: 1.0.0+1

environment:
  # Flutter 3.22 or newer is needed (the code uses WidgetStateProperty and
  # PopScope.onPopInvokedWithResult). The build workflow uses Flutter 3.24.0.
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  url_launcher: ^6.3.0
  youtube_player_flutter: ^9.0.3
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.2
  video_player: ^2.9.2
  chewie: ^1.8.5
  http: ^1.2.2
  # Shows PDFs inside the app (Drive preview). Kept below 4.11 on purpose: newer
  # releases pull Android libraries that need a newer compileSdk than the
  # Flutter 3.24 build template provides.
  webview_flutter: '>=4.8.0 <4.11.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  package_info_plus: ^8.0.0
  wakelock_plus: ">=1.2.0 <1.4.0"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
